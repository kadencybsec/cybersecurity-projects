name: Validate and render live learning dashboard
on:
  push:
    paths:
      - data/progress.json
      - scripts/render_dashboard.py
      - .github/workflows/progress-dashboard.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 70 projects and render SVG
        run: python scripts/render_dashboard.py
      - name: Publish changed graphic
        run: |
          if git diff --quiet -- assets/progress-dashboard.svg; then
            echo "No dashboard changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/progress-dashboard.svg
            git commit -m "chore: refresh learning dashboard [skip ci]"
            git push
          fi
