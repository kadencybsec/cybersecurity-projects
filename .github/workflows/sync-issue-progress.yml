name: Sync issue checklists to progress data

on:
  issues:
    types: [opened, edited, reopened, closed]
permissions:
  contents: write
  issues: read

jobs:
  update-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update progress register from a four-step issue
        run: python3 scripts/sync_issue_progress.py
      - name: Commit any actual progress changes
        run: |
          if git diff --quiet -- data/progress.json; then
            echo "No changed task completions"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/progress.json
          git commit -m "chore: sync verified project checklist progress [skip ci]"
          git push
