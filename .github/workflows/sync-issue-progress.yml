name: Sync issue checklists to progress data

on:
  issues:
    types: [opened, edited, reopened, closed]
  push:
    paths:
      - scripts/sync_issue_progress.py
      - tests/test_issue_sync.py
      - .github/workflows/sync-issue-progress.yml

permissions:
  contents: write
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test issue parser and progress rules
        run: python3 -m unittest discover -s tests -v
      - name: Synchronise completed checkboxes
        if: github.event_name == 'issues'
        run: python3 scripts/sync_issue_progress.py
      - name: Render dashboard from updated progress
        if: github.event_name == 'issues'
        run: python3 scripts/render_dashboard.py
      - name: Commit changed progress and dashboard
        if: github.event_name == 'issues'
        run: |
          if git diff --quiet -- data/progress.json assets/progress-dashboard.svg; then
            echo "No completed-step changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/progress.json assets/progress-dashboard.svg
          git commit -m "chore: sync recorded project progress [skip ci]"
          git push
